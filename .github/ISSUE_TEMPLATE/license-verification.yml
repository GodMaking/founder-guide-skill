name: 授权核验
description: 核验商业授权编号与授权书真伪
title: "[授权核验] "
body:
  - type: markdown
    attributes:
      value: |
        请提供授权编号与订单信息，作者会核对本地台账后回复。

        **不要在公开 Issue 中填写身份证、住址、电话、完整订单号、支付信息。** 订单号可只提供后四位或平台渠道。

  - type: input
    id: code
    attributes:
      label: 授权编号
      description: 形如 FG-20261113-XXXXXXXX
      placeholder: FG-20261113-XXXXXXXX
    validations:
      required: true

  - type: input
    id: order
    attributes:
      label: 订单号后四位或购买渠道
      placeholder: 例如：闲鱼，订单尾号 1234
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 需要核验的内容
      description: 例如：授权书是否由作者签发、授权范围、是否包含商业使用
      placeholder: 我想确认这份授权书是否真实，以及是否允许我在自己的咨询项目中使用。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我知道授权编号是溯源依据，不是技术锁或绝对版权证明
          required: true
        - label: 我不会在公开 Issue 中填写个人敏感信息
          required: true
